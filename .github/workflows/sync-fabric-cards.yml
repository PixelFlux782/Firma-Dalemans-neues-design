name: Stoffkarten synchronisieren

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Freigegebene Änderungen anwenden und als Pull Request öffnen"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fabric-card-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.FABRIC_CARD_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:fabric-cards

      - name: Quellen nur prüfen
        id: check
        shell: bash
        run: |
          set +e
          npm run sync:fabric-cards:check 2>&1 | tee fabric-card-sync-report.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prüfbericht anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-card-sync-report-${{ github.run_id }}
          path: fabric-card-sync-report.txt

      - name: Bei Fehler oder Review stoppen
        if: steps.check.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Der Check verlangt Review oder ist fehlgeschlagen (Exit ${{ steps.check.outputs.exit_code }})."
          exit 1

      - name: Freigegebene Quellen anwenden
        if: vars.FABRIC_CARD_SYNC_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.apply)
        run: npm run sync:fabric-cards:apply

      - name: Qualität prüfen
        if: vars.FABRIC_CARD_SYNC_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.apply)
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Pull Request erstellen
        if: vars.FABRIC_CARD_SYNC_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.apply)
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          branch="automation/fabric-cards-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add config/fabric-card-sources.json public/downloads/stoffkarten src/lib/knowledge/fabric-cards.public.json
          git commit -m "chore: Stoffkarten synchronisieren"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "Stoffkarten synchronisieren" --body-file fabric-card-sync-report.txt
