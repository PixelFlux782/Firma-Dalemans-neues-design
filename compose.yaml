services:
  dalemans:
    build:
      context: .
      dockerfile: Dockerfile
    image: dalemans-website:local
    init: true
    restart: unless-stopped
    env_file:
      - .env.docker.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
